<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>배경 이미지 관리</title>
	<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
	<main class="container">
		<h1>배경 이미지 관리</h1>
		<p class="subtitle">캐리커처에 사용할 배경 이미지를 여러 개 등록하세요. (로그인 없이 URL로만 접근하는 관리자 페이지입니다)</p>

		<div id="dropZone" class="drop-zone">
			<p>배경 이미지를 여기에 드래그하거나 클릭해서 추가하세요</p>
			<input type="file" id="fileInput" accept="image/*" hidden>
		</div>

		<p id="statusMessage" hidden></p>

		<h2 class="gallery-title">등록된 배경 이미지</h2>
		<div id="gallery" class="background-gallery"></div>
		<p id="emptyMessage" class="subtitle" hidden>등록된 배경 이미지가 없습니다.</p>

		<h2 class="gallery-title">폰트 등록</h2>
		<p class="subtitle">메인 페이지 홍보 문구에서 선택할 수 있는 폰트를 등록하세요. (.ttf, .otf, .woff, .woff2)</p>
		<div id="fontDropZone" class="drop-zone">
			<p>폰트 파일을 여기에 드래그하거나 클릭해서 추가하세요</p>
			<input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" hidden>
		</div>
		<p id="fontStatusMessage" hidden></p>
		<div id="fontList" class="font-list"></div>
		<p id="fontEmptyMessage" class="subtitle" hidden>등록된 폰트가 없습니다.</p>
	</main>

	<script src="/admin/assets/js/admin.js"></script>
</body>
</html>
