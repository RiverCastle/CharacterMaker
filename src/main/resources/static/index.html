<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI 캐리커처 메이커</title>
	<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
	<main class="container">
		<h1>AI 캐리커처 메이커</h1>
		<p class="subtitle">인물 사진을 업로드하면 나만의 캐리커처로 즉시 변환해드립니다.</p>

		<div id="dropZone" class="drop-zone">
			<p>사진을 여기에 드래그하거나 클릭해서 선택하세요</p>
			<input type="file" id="fileInput" accept="image/*" hidden>
		</div>

		<div class="preview-row">
			<div class="preview-box">
				<h2>원본</h2>
				<img id="originalPreview" alt="원본 미리보기">
			</div>
			<div class="preview-box">
				<h2>캐리커처</h2>
				<img id="resultPreview" alt="변환 결과">
				<div id="loading" class="loading" hidden>변환 중...</div>
			</div>
		</div>

		<button id="convertBtn" disabled>캐리커처로 변환하기</button>

		<section class="background-section">
			<h2>배경 이미지 선택</h2>
			<p class="section-hint">캐리커처와 합성할 배경 이미지를 선택하세요.</p>
			<div id="backgroundGallery" class="background-gallery"></div>
			<p id="backgroundEmptyMessage" class="section-hint" hidden>등록된 배경 이미지가 없습니다.</p>

			<div id="compositeStage" class="composite-stage" hidden>
				<img id="compositeBackground" alt="선택한 배경">
				<div id="compositeOverlay" class="composite-overlay">
					<img id="compositeOverlayImg" alt="배치 중인 캐리커처">
					<div id="resizeHandle" class="resize-handle"></div>
				</div>
			</div>
			<p class="section-hint">캐리커처를 드래그해서 위치를 옮기고, 모서리 손잡이로 크기를 조절하세요.</p>

			<button id="compositeBtn" disabled>배경과 합성하기</button>

			<div class="preview-box composite-result-box">
				<h2>합성 결과</h2>
				<img id="compositeResult" alt="합성 결과">
			</div>
		</section>

		<a id="downloadBtn" class="download-btn" hidden download>캐리커처 다운로드</a>
		<p id="errorMessage" class="error" hidden></p>
	</main>

	<script src="/assets/js/app.js"></script>
</body>
</html>
