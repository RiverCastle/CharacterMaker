<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI 캐리커처 메이커</title>
	<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
	<main class="container">
		<h1>AI 캐리커처 메이커</h1>
		<p class="subtitle">인물 사진을 업로드하면 나만의 캐리커처로 즉시 변환해드립니다.</p>

		<div id="dropZone" class="drop-zone">
			<p>사진을 여기에 드래그하거나 클릭해서 선택하세요</p>
			<input type="file" id="fileInput" accept="image/*" hidden>
		</div>

		<div class="preview-row">
			<div class="preview-box">
				<h2>원본</h2>
				<img id="originalPreview" alt="원본 미리보기">
			</div>
			<div class="preview-box">
				<h2>캐리커처</h2>
				<img id="resultPreview" alt="변환 결과">
				<div id="loading" class="loading" hidden>변환 중...</div>
			</div>
		</div>

		<button id="convertBtn" disabled>캐리커처로 변환하기</button>
		<a id="downloadBtn" class="download-btn" hidden download>캐리커처 다운로드</a>
		<p id="errorMessage" class="error" hidden></p>
	</main>

	<script src="/assets/js/app.js"></script>
</body>
</html>
