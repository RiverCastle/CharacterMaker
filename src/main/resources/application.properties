server.port=8081

spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local storage paths for uploaded photos and converted caricatures
app.storage.upload-dir=storage/uploads
app.storage.result-dir=storage/results
app.storage.background-dir=storage/background

# Caricature conversion provider: mock (local edge-detection placeholder) or gemini (real AI)
app.caricature.provider=mock

# Gemini API (used when app.caricature.provider=gemini)
app.gemini.base-url=https://generativelanguage.googleapis.com
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.1-flash-image
